{% extends "layout.html"%}

{% block title %}404 Not Found{% endblock %}

{% block description %}
    Oops! Looks like the page doesn't exist. Return to the Homepage.
{% endblock %}

{% block content %}
<header
    class="masthead"
    style="background-image: url('../static/assets/img/404.jpg')"
>
    <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
        <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="page-heading">
            <h1>Oops! Looks like this page does not exist.</h1>
            <span class="subheading"
            ><a href="{{ url_for('home') }}" id="not-found-backlink">Go to Home Page</a></span
            >
        </div>
        </div>
    </div>
    </div>
</header>       
{% endblock %}
